version: "3"

services:
  webapp-0:
    build: .
    ports:
      - "4000:3000"
    container_name: webapp-0
    environment:
      - MONGO_URL=mongodb://mongo:27017/its
      - CONTAINER_ID=webapp-0
    depends_on:
      - mongo
    networks:
      - app-network

  webapp-1:
    build: .
    ports:
      - "4001:3000"
    container_name: webapp-1
    environment:
      - MONGO_URL=mongodb://mongo:27017/its
      - CONTAINER_ID=webapp-1
    depends_on:
      - mongo
    networks:
      - app-network

  webapp-2:
    build: .
    ports:
      - "4002:3000"
    container_name: webapp-2
    environment:
      - MONGO_URL=mongodb://mongo:27017/its
      - CONTAINER_ID=webapp-2
    depends_on:
      - mongo
    networks:
      - app-network

  webapp-3:
    build: .
    ports:
      - "4003:3000"
    container_name: webapp-3
    environment:
      - MONGO_URL=mongodb://mongo:27017/its
      - CONTAINER_ID=webapp-3
    depends_on:
      - mongo
    networks:
      - app-network

  nginx:
    image: nginx
    container_name: nginx-lb
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - webapp-0
      - webapp-1
      - webapp-2
      - webapp-3
    networks:
      - app-network

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

volumes:
  mongo-data:

networks:
  app-network:
